<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI煎饼摊 - 诗词接龙游戏</title>
    <link rel="icon" type="image/jpeg" href="{{ url_for('static', filename='../img/image.jpg') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <!-- 移动端侧边栏切换按钮 -->
        <button id="mobileSidebarToggle" class="mobile-sidebar-toggle" aria-label="切换侧边栏">
            <span class="hamburger-line"></span>
            <span class="hamburger-line"></span>
            <span class="hamburger-line"></span>
        </button>
        
        <!-- 左侧控制面板 -->
        <aside class="control-panel" id="controlPanel">
            <header class="panel-header">
                <h1>AI煎饼摊</h1>
                <p class="subtitle">诗词接龙游戏</p>
            </header>

            <!-- 游戏信息 -->
            <section class="control-section">
                <!-- 游戏信息面板 -->
                <div class="info-panel">
                    <div class="info-item">
                        <span class="info-label">房间：</span>
                        <span class="info-value" id="roomId" style="font-size: 12px; color: #999;">加载中...</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">诗句数：</span>
                        <span class="info-value" id="poemCount">0</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">玩家诗句：</span>
                        <span class="info-value" id="playerPoemCount">0</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">AI诗句：</span>
                        <span class="info-value" id="aiPoemCount">0</span>
                    </div>
                </div>
            </section>

            <!-- 诗句输入 -->
            <section class="control-section">
                <h3>❖ 诗句输入</h3>
                <div class="input-group">
                    <input type="text" id="poemInput" placeholder="请输入诗句" maxlength="30">
                    <div class="char-count">
                        <span id="currentChars">0</span>/30
                    </div>
                </div>
                <button id="addPoemBtn" class="btn btn-primary">添加诗句</button>
            </section>

            <!-- AI设置 -->
            <section class="control-section">
                <h3>❖ AI设置</h3>
                <div class="ai-toggle">
                    <label class="toggle-switch">
                        <input type="checkbox" id="aiToggle" checked>
                        <span class="toggle-slider"></span>
                    </label>
                    <span class="toggle-label">AI自动接诗</span>
                </div>
            </section>

            <!-- 玩家颜色选择 -->
            <section class="control-section">
                <h3>❖ 玩家颜色</h3>
                <div class="color-picker">
                    <div class="color-option" style="background-color: #9370DB;" data-color="#9370DB" title="藤萝紫"></div>
                    <div class="color-option" style="background-color: #6B8E23;" data-color="#6B8E23" title="竹青"></div>
                    <div class="color-option" style="background-color: #87CEEB;" data-color="#87CEEB" title="天青蓝"></div>
                    <div class="color-option" style="background-color: #CD5C5C;" data-color="#CD5C5C" title="胭脂红"></div>
                    <input type="color" id="customColorPicker" class="color-option" title="自定义颜色">
                </div>
            </section>

            <!-- AI颜色选择 -->
            <section class="control-section">
                <h3>❖ AI颜色</h3>
                <div class="color-picker">
                    <div class="color-option ai-color" style="background-color: #FFB6C1;" data-color="#FFB6C1" title="淡粉红"></div>
                    <div class="color-option ai-color" style="background-color: #FFD700;" data-color="#FFD700" title="金色"></div>
                    <div class="color-option ai-color" style="background-color: #98FB98;" data-color="#98FB98" title="淡绿"></div>
                    <div class="color-option ai-color" style="background-color: #DDA0DD;" data-color="#DDA0DD" title="梅红"></div>
                    <input type="color" id="aiCustomColorPicker" class="color-option" title="自定义AI颜色">
                </div>
            </section>

            <!-- 游戏控制 -->
            <section class="control-section">
                <h3>❖ 游戏控制</h3>
                <div class="button-group">
                    <button id="resetBtn" class="btn btn-secondary">重置游戏</button>
                    <button id="exportBtn" class="btn btn-primary">📥 导出画布</button>
                    <button id="importBtn" class="btn btn-primary">📤 导入画布</button>
                    <input type="file" id="importFileInput" accept=".json" style="display: none;">
                </div>
            </section>

            <!-- 游戏规则 -->
            <section class="control-section">
                <h3>❖ 游戏规则</h3>
                <div class="rules">
                    <p>1. 第一句诗放置在(45,45)位置</p>
                    <p>2. 点击已有诗句中的字符进行接龙</p>
                    <p>3. 接龙必须横纵转换方向</p>
                    <p>4. 新诗句不能与已有诗句重叠</p>
                    <p>5. 支持拖拽和缩放操作</p>
                </div>
            </section>
        </aside>

        <!-- 右侧游戏画布 -->
        <main class="game-canvas-wrapper">
            <div id="aiStatusPanel" class="ai-status-panel">
                <div class="ai-status-header">
                    <span class="ai-icon">📍</span>
                    <span class="ai-status-title">AI状态</span>
                </div>
                <div id="aiStatusContent" class="ai-status-content">
                    <span class="ai-status-idle">待机中</span>
                </div>
            </div>
            <canvas id="gameCanvas"></canvas>
        </main>
    </div>

    <!-- 移动端侧边栏遮罩层 -->
    <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <!-- 提示信息容器 -->
    <div id="toastContainer"></div>

    <!-- 诗词详情模态框 -->
    <div id="poemDetailModal" class="modal" style="display: none;">
        <div class="modal-content poem-detail-content">
            <div class="modal-header">
                <h3 id="poemDetailTitle">诗词详情</h3>
                <span class="close" onclick="document.getElementById('poemDetailModal').style.display='none'">&times;</span>
            </div>
            <div class="modal-body">
                <div class="poem-detail-info">
                    <p><strong>标题：</strong><span id="poemDetailTitleText"></span></p>
                    <p id="poemDetailRhythmicRow" style="display: none;"><strong>词牌：</strong><span id="poemDetailRhythmic"></span></p>
                    <p><strong>作者：</strong><span id="poemDetailAuthor"></span></p>
                    <p><strong>朝代：</strong><span id="poemDetailDynasty"></span></p>
                    <p><strong>AI接句：</strong><span id="poemDetailOriginal"></span></p>
                    <p id="poemDetailFullSentenceRow" style="display: none;"><strong>完整句：</strong><span id="poemDetailFullSentence"></span></p>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
